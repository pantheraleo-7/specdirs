[project]
name = "specdirs"
version = "0.1.0rc3"
description = "Composable, modern, and compliant library for standard directories"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Asadullah Shaikh" }
]
urls = { Repository = "https://github.com/pantheraleo-7/specdirs" }
keywords = ["known", "folders", "XDG", "base", "user", "dirs", "platform", "project", "app"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Filesystems",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.18,<0.12"]
build-backend = "uv_build"
